databases:
  - name: pgcet-db
    databaseName: pgcet_db
    user: pgcet_user
    plan: free

services:
  - type: web
    name: pgcet-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pgcet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://pgcet-portal.vercel.app"
      - key: STORAGE_TYPE
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
